name: Generate figures and PDF report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run numerical study
        run: python run_study.py

      - name: Build PDF report
        run: python build_report.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.csv dispersion_grid.npz figures/ REPORT.pdf
          if git diff --cached --quiet; then
            echo "Generated outputs are already up to date."
          else
            git commit -m "Generate numerical figures and PDF report"
            git push
          fi
